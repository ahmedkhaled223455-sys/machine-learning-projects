name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          for req in $(find . -name requirements.txt -not -path "*/pyspark/*" -not -path "./geo-rail-analysis/*"); do
            pip install -r "$req"
          done

      - name: Lint (pyflakes rules -- catches real bugs, not style nits)
        run: ruff check . --select F,E9

      - name: Train fixtures needed by tests (model-serving-api)
        run: python model-serving-api/src/train_model.py

      - name: Run unit tests
        run: pytest -v

  smoke-test:
    name: Smoke test ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: customer-segmentation
            run: python src/segment.py
          - project: diabetes-risk-prediction
            run: python src/train.py
          - project: fuel-efficiency-regression
            run: python src/analyze.py
          - project: neural-network-from-scratch
            run: python src/train.py
          - project: sensor-anomaly-detection
            run: python src/generate_data.py && python src/detect.py
          - project: data-quality-verification
            run: python src/generate_dataset.py && python src/run_pipeline.py
          - project: student-outcomes-analysis
            run: |
              python src/build_database.py
              python src/run_sql_analysis.py
              python src/efficacy_analysis.py
              python src/predict_scores.py
          - project: model-serving-api
            run: |
              python src/train_model.py
              python -m pytest tests/ -v
          - project: marketing-attribution
            run: |
              python src/generate_data.py
              python src/run_analysis.py
          - project: financial-data-health
            run: |
              python src/generate_prices.py
              python src/monitor.py
          - project: ncaa-transfer-portal
            run: |
              python src/generate_data.py
              python src/run_analysis.py
              python src/polars_pipeline.py
              python -m pytest tests/ -v
          - project: injection-geomechanics
            run: |
              python -m pytest tests/ -v
              python src/run_study.py
          - project: bearing-fault-diagnostics
            run: |
              python -m pytest tests/ -v
              python src/run_study.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.project }}/requirements.txt

      - name: Run pipeline end-to-end
        working-directory: ${{ matrix.project }}
        run: ${{ matrix.run }}

  smoke-test-network:
    name: Smoke test language-model-from-scratch (needs network fetch)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true  # external corpus download; don't fail the badge on a flaky fetch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r language-model-from-scratch/requirements.txt

      - name: Download corpus + run pipeline
        working-directory: language-model-from-scratch
        run: |
          python data/download_data.py
          python src/train.py

  smoke-test-pyspark:
    name: Smoke test PySpark port (student-outcomes-analysis)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true  # heavy JVM dependency; don't fail the badge on a runner quirk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-outcomes-analysis/pyspark/requirements.txt

      - name: Run Spark analysis
        working-directory: student-outcomes-analysis
        run: python pyspark/spark_analysis.py

  smoke-test-mongo:
    name: Smoke test NoSQL catalog (MongoDB service container)
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nosql-product-catalog/requirements.txt

      - name: Generate, ingest, query, and test against MongoDB
        working-directory: nosql-product-catalog
        run: |
          python src/generate_data.py
          python src/ingest.py
          python src/queries.py
          python -m pytest tests/ -v

  smoke-test-localstack:
    name: AWS pipeline integration (LocalStack)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true  # heavier emulator; moto tests in lint-and-test are the authoritative check
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aws-data-pipeline/requirements.txt

      - name: Wait for LocalStack to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null; then
              echo "localstack ready"; exit 0
            fi
            sleep 2
          done
          echo "localstack did not become ready"; exit 1

      - name: Run pipeline end-to-end against LocalStack
        working-directory: aws-data-pipeline
        run: |
          python src/generate_events.py
          python src/setup_resources.py
          python src/load_raw.py
          python src/pipeline.py

  geospatial-analysis:
    name: Geospatial analysis (GeoPandas/Shapely)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r geo-rail-analysis/requirements.txt

      - name: Validate distances, run geospatial analysis, and test
        working-directory: geo-rail-analysis
        run: |
          python src/validate_distances.py
          python src/geo_analysis.py
          python -m pytest tests/ -v

  java-rail-optimizer:
    name: Java rail-network optimizer (compile + tests)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile, test, and run the optimizer
        working-directory: rail-network-optimizer
        run: |
          javac -d out src/*.java tests/*.java
          java -cp out NetworkTests
          java -cp out RouteOptimizer Seattle Chicago

  r-analysis:
    name: R data-health report (financial-data-health)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true  # R toolchain setup; Python monitor is the authoritative check
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the data panel, then run the R report
        working-directory: financial-data-health
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/generate_prices.py
          Rscript src/health_report.R

  forecasting-train-eval:
    name: Train + backtest + promotion gate (plant-sensor-forecasting, PyTorch)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        working-directory: plant-sensor-forecasting
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-torch.txt

      - name: Unit tests (including the PyTorch model tests)
        working-directory: plant-sensor-forecasting
        run: python -m pytest -v tests

      - name: Train ensembles, backtest all scenarios, run promotion gate
        working-directory: plant-sensor-forecasting
        run: python src/backtest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: forecasting-results
          path: plant-sensor-forecasting/results/

  forecasting-docker:
    name: Docker build (plant-sensor-forecasting)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs the test suite inside the container)
        run: docker build -t plant-forecasting plant-sensor-forecasting

  mcp-server-stdio:
    name: MCP server over stdio (mcp-grants-server)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (official MCP Python SDK)
        working-directory: mcp-grants-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Unit + in-memory protocol tests
        working-directory: mcp-grants-server
        run: python -m pytest -v tests

      - name: End-to-end smoke test (client launches the server over stdio)
        working-directory: mcp-grants-server
        run: python src/smoke_client.py

  trajectory-transformer:
    name: Train + benchmark (trajectory-prediction-transformer, PyTorch)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        working-directory: trajectory-prediction-transformer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-torch.txt

      - name: Unit tests (attention vs NumPy reference, invariances, overfit check)
        working-directory: trajectory-prediction-transformer
        run: python -m pytest -v tests

      - name: Train transformer + ablations, benchmark against baselines
        working-directory: trajectory-prediction-transformer
        run: python src/train_eval.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-results
          path: trajectory-prediction-transformer/results/
